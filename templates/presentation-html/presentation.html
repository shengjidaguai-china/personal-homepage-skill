<!doctype html>
<html lang="zh-CN" data-edit-key="presentation-template-edits">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>16:9 HTML Presentation</title>
  <style>
    :root {
      --stage-w: 1920;
      --stage-h: 1080;
      --bg: #0b0b0f;
      --ink: #f8f4ec;
      --muted: rgba(248,244,236,.68);
      --accent: #ff6a3d;
      --font-body: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050507; color: var(--ink); font-family: var(--font-body); }
    .viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 80% 10%, rgba(255,106,61,.22), transparent 30%), #050507; }
    .stage-shell { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; }
    .stage { position: absolute; left: 0; top: 0; width: calc(var(--stage-w) * 1px); height: calc(var(--stage-h) * 1px); transform: scale(var(--scale, 1)); transform-origin: left top; overflow: hidden; background: var(--bg); box-shadow: 0 32px 120px rgba(0,0,0,.42); }
    .slide { position: absolute; inset: 0; padding: 92px 104px; visibility: hidden; opacity: 0; pointer-events: none; background: var(--bg); }
    .slide.active { visibility: visible; opacity: 1; pointer-events: auto; }
    .kicker { font-family: var(--font-mono); font-size: 24px; letter-spacing: 0; color: var(--accent); text-transform: uppercase; }
    h1 { margin: 34px 0 0; max-width: 1280px; font-size: 128px; line-height: .95; letter-spacing: 0; text-wrap: balance; }
    h2 { margin: 0; max-width: 1180px; font-size: 88px; line-height: 1.02; letter-spacing: 0; text-wrap: balance; }
    p { margin: 0; color: var(--muted); font-size: 34px; line-height: 1.65; }
    .lead { margin-top: 42px; max-width: 980px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 60px; }
    .card { min-height: 250px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; padding: 34px; background: rgba(255,255,255,.07); }
    .card h3 { margin: 0 0 18px; font-size: 36px; }
    .card p { font-size: 25px; line-height: 1.6; }
    .counter { position: fixed; right: 28px; bottom: 24px; z-index: 10; font-family: var(--font-mono); color: rgba(255,255,255,.6); font-size: 13px; }
    .hint { position: fixed; left: 28px; bottom: 24px; z-index: 10; color: rgba(255,255,255,.45); font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    @media print { .edit-hotzone, .edit-toggle { display: none !important; } }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage-shell" id="stageShell">
      <main class="stage" id="stage" aria-live="polite">
        <section class="slide active" aria-label="Slide 1" data-slide-id="opening" data-original-number="01" data-slide-title="把项目讲成一套清楚的 16:9 演示">
          <div class="kicker" data-edit-id="opening-kicker">Project / 2026</div>
          <h1 data-edit-id="opening-title">把项目讲成一套清楚的 16:9 演示</h1>
          <p class="lead" data-edit-id="opening-lead">这里放 1-2 句核心说明。长段中文不要做成巨大标题；需要更多信息时拆成下一页。</p>
        </section>
        <section class="slide" aria-label="Slide 2" data-slide-id="one-idea-per-slide" data-original-number="02" data-slide-title="一页只承担一个主要观点">
          <h2 data-edit-id="one-idea-per-slide-title">一页只承担一个主要观点</h2>
          <div class="grid">
            <article class="card"><h3 data-edit-id="one-idea-per-slide-problem-title">问题</h3><p data-edit-id="one-idea-per-slide-problem-body">用短句说明背景和痛点。</p></article>
            <article class="card"><h3 data-edit-id="one-idea-per-slide-solution-title">方案</h3><p data-edit-id="one-idea-per-slide-solution-body">说明你的关键设计或实现。</p></article>
            <article class="card"><h3 data-edit-id="one-idea-per-slide-result-title">结果</h3><p data-edit-id="one-idea-per-slide-result-body">展示真实结果；没有数据就写待补充。</p></article>
          </div>
        </section>
      </main>
    </div>
  </div>
  <aside hidden data-note-for="opening" data-edit-id="opening-notes">在这里保留开场的完整讲稿。页面只摘取听众需要看到的重点。</aside>
  <aside hidden data-note-for="one-idea-per-slide" data-edit-id="one-idea-per-slide-notes">在这里按原稿顺序说明问题、方案和结果。请用真实案例替换占位内容。</aside>
  <div class="hint">← / → / Space 翻页，F 全屏，N 演讲者模式</div>
  <div class="counter" id="counter">01 / 02</div>

<style id="html-runtime-style">/* Shared editing chrome; independent of homepage/slide layouts. */
.html-tools{position:fixed;left:0;top:0;z-index:10000;padding:14px;display:flex;gap:8px;opacity:0;transition:opacity .15s;background:#20212a;border-radius:0 0 12px 0;color:#fff}
.edit-hotzone{position:fixed;left:0;top:0;width:100px;height:64px;z-index:9999}
.edit-hotzone:hover+.html-tools,.html-tools:hover,.html-tools:focus-within,body.editing .html-tools{opacity:1}
.html-tools button{position:static;transform:none;opacity:1;pointer-events:auto;font:600 14px/1.4 'PingFang SC','Microsoft YaHei',sans-serif;color:#fff;background:#343744;border:1px solid #777;padding:8px 12px;border-radius:5px;cursor:pointer}
.html-tools button:focus-visible{outline:3px solid #ffcc68;outline-offset:3px}
body.editing [data-edit-id]:not([data-note-for]){outline:2px dashed #ed9857;outline-offset:4px;cursor:text}
.html-status{position:fixed;bottom:50px;left:24px;z-index:10001;background:#20212a;color:#fff;padding:12px 18px;max-width:min(580px,90vw);font:15px/1.6 'PingFang SC',sans-serif}
.html-status:empty{display:none}
[data-note-for]{display:none!important}
@media(hover:none){.html-tools{opacity:1}}
@media print{.edit-hotzone,.html-tools,.html-status{display:none!important}}
@media(prefers-reduced-motion:reduce){.html-tools{transition:none}}
</style>
<script id="html-runtime">
/* Shared runtime. Source of truth: assets/html-runtime.js; inline with bundle-html-runtime.mjs. */

  'use strict';
  if (window.HtmlTools) return;

  const toolbar = document.createElement('div');
  toolbar.className = 'html-tools';
  toolbar.innerHTML = '<button class="edit-toggle" aria-pressed="false">编辑</button><button id="exportHtml">导出 HTML</button>';

      n.spellcheck = false;
    }

  function save() {

    for (const n of nodes()) saved[n.dataset.editId] = n.innerHTML;
    try { localStorage.setItem(key, JSON.stringify(saved)); }

  }

    save();

    clone.dataset.editVersion = 'export-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    clone.querySelector('body').classList.remove('editing');
    clone.querySelectorAll('[data-runtime-generated]').forEach(n => n.remove());

  }

  toolbar.querySelector('#exportHtml').onclick = exportHTML;
  hotzone.onclick = () => setActive(!active);
  document.addEventListener('input', e => { if (e.target.closest?.('[data-edit-id]')) save(); });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
    if (e.key === 'Escape' && active) { e.preventDefault(); setActive(false); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || isTyping(e.target)) return;
    if (e.key.toLowerCase() === 'e') { e.preventDefault(); setActive(!active); }
  });
  window.HtmlTools = {save, refresh, setActive, exportHTML, notify, isTyping, toolbar, get active() {return active;}, key};
  refresh({restore:true});
})();

</script>

    if (d.type === 'navigate') {
      if (d.edge === 'first') go(0); else if (d.edge === 'last') go(slides().length-1);
      else if (d.delta === 1 || d.delta === -1) go(index+d.delta);
    }
    if (d.type === 'notes-edit' && typeof d.text === 'string' && slides().some(s => s.dataset.slideId === d.id)) {
      const n = noteFor(d.id); if (n) {n.textContent = d.text; tools.save();}
    }
  });
  button.onclick = openPresenter;
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || tools.isTyping(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)) {e.preventDefault();go(index+1);}
    if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) {e.preventDefault();go(index-1);}
    if (e.key === 'Home') {e.preventDefault();go(0);}
    if (e.key === 'End') {e.preventDefault();go(slides().length-1);}
    if (e.key.toLowerCase() === 'n') {e.preventDefault();openPresenter();}
    if (e.key.toLowerCase() === 'f') {
      e.preventDefault();
      const action = document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.();
      action?.catch(() => tools.notify('浏览器未允许全屏，可使用浏览器全屏菜单。'));
    }
  });
  let touch;
  stage.addEventListener('touchstart', e => {touch = tools.isTyping(e.target) ? null : e.changedTouches[0];}, {passive:true});
  stage.addEventListener('touchend', e => {if (!touch) return; const t = e.changedTouches[0], dx = t.clientX-touch.clientX, dy = t.clientY-touch.clientY; if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) go(index+(dx<0?1:-1)); touch=null;}, {passive:true});
  document.addEventListener('html:change', () => {
    slides().forEach(s => s.dataset.slideTitle = titleFor(s)); syncPresenter();
  });
  document.addEventListener('html:before-export', e => {
    e.detail.clone.querySelectorAll('.slide-dots').forEach(n => n.replaceChildren());
    const list = [...e.detail.clone.querySelectorAll('.slide')];
    list.forEach((s,i) => {s.classList.toggle('active',i===0);s.setAttribute('aria-hidden',String(i!==0));s.inert=i!==0;});
    const counter = e.detail.clone.querySelector('#counter'); if (counter) counter.textContent = countText(list.length?1:0,list.length);
  });
  new MutationObserver(records => {
    if (records.some(r => [...r.addedNodes,...r.removedNodes].some(n => n.nodeType === 1 && (n.matches('.slide') || n.querySelector('.slide'))))) refresh();
  }).observe(stage, {childList:true,subtree:true});
  addEventListener('resize',resize); addEventListener('hashchange',fromHash);
  window.DeckPlayer = {go,refresh,openPresenter,syncPresenter,get index(){return index;}};
  resize();fromHash();
})();

</script>
<!-- html-runtime:end -->
