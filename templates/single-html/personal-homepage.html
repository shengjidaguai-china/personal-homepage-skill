<!doctype html>
<html lang="zh-CN" data-edit-key="personal-homepage-template-edits">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人主页｜待补充</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --panel: rgba(255,255,255,0.08);
      --text: #f8f4ec;
      --muted: rgba(248,244,236,0.68);
      --accent: #ff6a3d;
      --font-body: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; font-family: var(--font-body); color: var(--text); background: radial-gradient(circle at 80% 10%, rgba(255,106,61,.26), transparent 30%), var(--bg); }
    a { color: inherit; }
    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 64px; }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 18px; color: var(--muted); }
    .brand { font-weight: 900; color: var(--text); }
    .links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
    .hero { min-height: 76vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .8fr); align-items: center; gap: 48px; padding: 64px 0; }
    .eyebrow { color: var(--accent); font-weight: 800; letter-spacing: .16em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 18px 0 0; font-size: clamp(42px, 7vw, 92px); line-height: .98; letter-spacing: -.06em; text-wrap: balance; }
    .lead { max-width: 680px; margin: 24px 0 0; color: var(--muted); font-size: clamp(17px, 2vw, 22px); line-height: 1.85; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .btn { border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 13px 18px; text-decoration: none; font-weight: 800; }
    .btn.primary { background: var(--accent); color: #111; border-color: transparent; }
    .portrait { min-height: 420px; border: 1px solid rgba(255,255,255,.12); border-radius: 32px; background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); display: grid; place-items: center; color: var(--muted); text-align: center; padding: 28px; }
    .section { padding: 56px 0; border-top: 1px solid rgba(255,255,255,.1); }
    .section h2 { font-size: clamp(28px, 4vw, 52px); margin: 0 0 24px; line-height: 1.08; text-wrap: balance; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card { border: 1px solid rgba(255,255,255,.1); border-radius: 24px; background: var(--panel); padding: 22px; min-height: 180px; }
    .card p { color: var(--muted); line-height: 1.8; }
    @media (max-width: 780px) { .hero, .grid { grid-template-columns: 1fr; } .hero { min-height: auto; gap: 28px; } .portrait { min-height: 260px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
    @media print { .edit-hotzone, .edit-toggle { display: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="主导航">
      <div class="brand">姓名待补充</div>
      <div class="links"><a href="#projects">项目</a><a href="#skills">能力</a><a href="#contact">联系</a></div>
    </nav>
    <section class="hero">
      <div>
        <div class="eyebrow" data-edit-id="hero-eyebrow">Role / 待补充</div>
        <h1 data-edit-id="hero-title">把一句清楚的个人定位放在这里</h1>
        <p class="lead" data-edit-id="hero-lead">这里写 1-2 句可读的中文介绍。不要把长段正文做成巨大标题；如果内容很多，请拆到下方项目或关于区域。</p>
        <div class="actions"><a class="btn primary" href="#projects">查看项目</a><a class="btn" href="#contact">联系我</a></div>
      </div>
      <div class="portrait" role="img" aria-label="个人头像或项目视觉占位">图片 / 作品 / 项目截图占位</div>
    </section>
    <section id="projects" class="section">
      <h2 data-edit-id="projects-title">精选项目</h2>
      <div class="grid">
        <article class="card"><h3 data-edit-id="project-alpha-title">项目名称</h3><p data-edit-id="project-alpha-description">问题、角色、功能、技术栈和结果待补充。</p></article>
        <article class="card"><h3 data-edit-id="project-beta-title">项目名称</h3><p data-edit-id="project-beta-description">问题、角色、功能、技术栈和结果待补充。</p></article>
        <article class="card"><h3 data-edit-id="project-gamma-title">项目名称</h3><p data-edit-id="project-gamma-description">问题、角色、功能、技术栈和结果待补充。</p></article>
      </div>
    </section>
    <section id="skills" class="section"><h2 data-edit-id="skills-title">能力结构</h2><p class="lead" data-edit-id="skills-description">把技能按能力组展示，而不是堆满标签。</p></section>
    <section id="contact" class="section"><h2 data-edit-id="contact-title">联系</h2><p class="lead" data-edit-id="contact-description">邮箱、社交主页或二维码待补充。</p></section>
  </main>
<!-- html-runtime:start -->
<style id="html-runtime-style">/* Shared editing chrome; independent of homepage/slide layouts. */
.html-tools{position:fixed;left:0;top:0;z-index:10000;padding:14px;display:flex;gap:8px;opacity:0;transition:opacity .15s;background:#20212a;border-radius:0 0 12px 0;color:#fff}
.edit-hotzone{position:fixed;left:0;top:0;width:100px;height:64px;z-index:9999}
.edit-hotzone:hover+.html-tools,.html-tools:hover,.html-tools:focus-within,body.editing .html-tools{opacity:1}
.html-tools button{position:static;transform:none;opacity:1;pointer-events:auto;font:600 14px/1.4 'PingFang SC','Microsoft YaHei',sans-serif;color:#fff;background:#343744;border:1px solid #777;padding:8px 12px;border-radius:5px;cursor:pointer}
.html-tools button:focus-visible{outline:3px solid #ffcc68;outline-offset:3px}
body.editing [data-edit-id]:not([data-note-for]){outline:2px dashed #ed9857;outline-offset:4px;cursor:text}
.html-status{position:fixed;bottom:50px;left:24px;z-index:10001;background:#20212a;color:#fff;padding:12px 18px;max-width:min(580px,90vw);font:15px/1.6 'PingFang SC',sans-serif}
.html-status:empty{display:none}
[data-note-for]{display:none!important}
@media(hover:none){.html-tools{opacity:1}}
@media print{.edit-hotzone,.html-tools,.html-status{display:none!important}}
@media(prefers-reduced-motion:reduce){.html-tools{transition:none}}
</style>
<script id="html-runtime">
/* Shared runtime. Source of truth: assets/html-runtime.js; inline with bundle-html-runtime.mjs. */
(() => {
  'use strict';
  if (window.HtmlTools) return;
  const root = document.documentElement;
  const hotzone = document.createElement('div');
  hotzone.className = 'edit-hotzone';
  hotzone.setAttribute('aria-hidden', 'true');
  const toolbar = document.createElement('div');
  toolbar.className = 'html-tools';
  toolbar.innerHTML = '<button class="edit-toggle" aria-pressed="false">编辑</button><button id="exportHtml">导出 HTML</button>';
  const status = document.createElement('div');
  status.className = 'html-status'; status.setAttribute('role', 'status');
  for (const el of [hotzone, toolbar, status]) el.dataset.runtimeGenerated = '';
  document.body.append(hotzone, toolbar, status);
  let active = false, warningTimer;
  const key = (root.dataset.editKey || 'html-edits') + ':' + location.pathname + (root.dataset.editVersion ? ':' + root.dataset.editVersion : '');
  let saved = {};
  try { const data = JSON.parse(localStorage.getItem(key) || '{}'); if (data && typeof data === 'object' && !Array.isArray(data)) saved = data; } catch {}
  const nodes = () => [...document.querySelectorAll('[data-edit-id]')];
  function notify(text) { status.textContent = text; clearTimeout(warningTimer); warningTimer = setTimeout(() => status.textContent = '', 6000); }
  function refresh({restore = false} = {}) {
    const ids = new Set();
    for (const n of nodes()) {
      const id = n.dataset.editId;
      if (!id || ids.has(id)) { notify('编辑 ID 缺失或重复，请先修复页面中的 data-edit-id'); continue; }
      ids.add(id);
      if (restore && Object.hasOwn(saved, id) && typeof saved[id] === 'string') n.innerHTML = saved[id];
      n.contentEditable = String(active && !n.hasAttribute('data-note-for'));
      n.spellcheck = false;
    }
  }
  function save() {
    // Retain IDs of temporarily filtered-out items; never map by DOM position.
    for (const n of nodes()) saved[n.dataset.editId] = n.innerHTML;
    try { localStorage.setItem(key, JSON.stringify(saved)); }
    catch { notify('本地保存不可用或空间不足，请导出 HTML 保存修改。'); }
    document.dispatchEvent(new CustomEvent('html:change'));
  }
  function setActive(value) {
    active = Boolean(value); document.body.classList.toggle('editing', active);
    toolbar.querySelector('.edit-toggle').textContent = active ? '结束编辑' : '编辑';
    toolbar.querySelector('.edit-toggle').setAttribute('aria-pressed', String(active));
    refresh();
    if (!active) { if (document.activeElement?.closest('[data-edit-id]')) document.activeElement.blur(); save(); }
  }
  function exportHTML() {
    save();
    const clone = root.cloneNode(true);
    clone.dataset.editVersion = 'export-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    clone.querySelector('body').classList.remove('editing');
    clone.querySelectorAll('[data-runtime-generated]').forEach(n => n.remove());
    clone.querySelectorAll('[contenteditable]').forEach(n => n.setAttribute('contenteditable', 'false'));
    document.dispatchEvent(new CustomEvent('html:before-export', {detail: {clone}}));
    const url = URL.createObjectURL(new Blob(['<!doctype html>\n' + clone.outerHTML], {type:'text/html;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url;
    a.download = (root.dataset.exportName || document.title || 'page').replace(/[\\/:*?"<>|]/g, '-') + '.html';
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  const isTyping = target => Boolean(target?.closest?.('input,textarea,select,[contenteditable="true"]'));
  toolbar.querySelector('.edit-toggle').onclick = () => setActive(!active);
  toolbar.querySelector('#exportHtml').onclick = exportHTML;
  hotzone.onclick = () => setActive(!active);
  document.addEventListener('input', e => { if (e.target.closest?.('[data-edit-id]')) save(); });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
    if (e.key === 'Escape' && active) { e.preventDefault(); setActive(false); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || isTyping(e.target)) return;
    if (e.key.toLowerCase() === 'e') { e.preventDefault(); setActive(!active); }
  });
  window.HtmlTools = {save, refresh, setActive, exportHTML, notify, isTyping, toolbar, get active() {return active;}, key};
  refresh({restore:true});
})();

</script>
<!-- html-runtime:end -->
</body>
</html>
